<div class="block-detail-wrapper">
    <!-- HEADER -->
    <div class="header-section">
        <div class="title-row">
            <button class="btn-back" (click)="goBack()">
                <i class="ph ph-arrow-left"></i>
            </button>
            <div class="text-info">
                <h2>{{ blockName }}</h2>
                <span>{{ repertoireName }}</span>
            </div>
        </div>

        <button class="btn-add" (click)="openAddModal()">
            <i class="ph ph-plus"></i> Adicionar Música
        </button>
    </div>

    <!-- CONTENT LIST -->
    <div class="list-container">
        <div class="empty-state" *ngIf="musics.length === 0">
            <i class="ph ph-music-notes"></i>
            <p>Nenhuma música neste bloco ainda.</p>
        </div>

        <div *ngFor="let music of musics; let i = index" class="music-card" [class.active-card]="openMenuIndex === i"
            (click)="openMusic(music)">

            <div class="info">
                <div class="music-name">{{ music.name }} <span class="music-tone" *ngIf="music.tone">- Tom: {{
                        music.tone }}</span></div>
                <div class="artist-name">- {{ music.artist }}</div>
            </div>

            <!-- ACTION MENU -->
            <div class="action-wrapper">
                <div class="edit-icon" (click)="toggleMenu(i, $event)">
                    <i class="ph ph-pencil-simple-line"></i>
                </div>

                <!-- DROPDOWN -->
                <div class="dropdown-menu" *ngIf="openMenuIndex === i" (click)="$event.stopPropagation()">
                    <button class="dropdown-item" (click)="openMusic(music)">
                        <i class="ph ph-browser"></i> Abrir
                    </button>

                    <button class="dropdown-item" [class.copied]="copiedId === i" (click)="copyLink(music, i, $event)">
                        <i class="ph" [ngClass]="copiedId === i ? 'ph-check-circle' : 'ph-link'"></i>
                        {{ copiedId === i ? 'Link copiado!' : 'Copiar Link' }}
                    </button>

                    <button class="dropdown-item delete" (click)="removeMusic(music, $event)">
                        <i class="ph ph-trash"></i> Remover
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- OVERLAY BACKDROP -->
    <div class="menu-overlay" *ngIf="openMenuIndex !== null" (click)="openMenuIndex = null"></div>
</div>

<!-- ADD MUSIC MODAL -->
<div class="modal-overlay" *ngIf="showAddModal">
    <div class="modal-card add-music-card">
        <div class="modal-header">
            <h3>Adicionar Música</h3>
            <button class="close-btn" (click)="closeAddModal()"><i class="ph ph-x"></i></button>
        </div>

        <div class="search-bar">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" placeholder="Buscar na sua biblioteca..." [formControl]="searchControl">
        </div>

        <div class="library-list">
            <div *ngFor="let music of filteredLibrary" class="library-item" (click)="addMusicToBlock(music)">
                <div class="lib-info">
                    <strong>{{ music.name }}</strong>
                    <span>{{ music.artist }}</span>
                </div>
                <i class="ph ph-plus-circle"></i>
            </div>
            <div class="empty-search" *ngIf="filteredLibrary.length === 0">
                Nenhuma música encontrada.
            </div>
        </div>
    </div>
</div>

<!-- REMOVE CONFIRM MODAL -->
<div class="modal-overlay" *ngIf="showRemoveModal">
    <div class="modal-card">
        <div class="modal-icon">
            <i class="ph ph-trash"></i>
        </div>
        <h3>Remover Música?</h3>
        <p>Deseja remover <strong>{{ musicToRemove?.name }}</strong> deste bloco?</p>

        <div class="modal-actions">
            <button class="btn-cancel" (click)="cancelRemove()">Cancelar</button>
            <button class="btn-confirm" (click)="confirmRemove()">Remover</button>
        </div>
    </div>
</div>
