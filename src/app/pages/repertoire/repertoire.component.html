<div class="repertorios-wrapper">

  <!-- CARDZÃO / BOARD -->
  <div class="board">

    <!-- TOPO -->
    <div class="board-header">
      <h1>Repertórios</h1>

      <button class="btn-add" (click)="openModal(false); $event.stopPropagation()">
        + Criar Repertório
      </button>
    </div>

    <div class="drag-boundary">
      <div class="scroll-container" #scrollContainer cdkScrollable>

        <div class="cards" cdkDropList [cdkDropListAutoScrollStep]="10" (cdkDropListDropped)="drop($event)">

          <div class="card" *ngFor="let rep of repertorios; trackBy: trackById; let i = index" cdkDrag
            [cdkDragDisabled]="openMenuIndex !== null" cdkDragLockAxis="y" cdkDragBoundary=".drag-boundary"
            (click)="openRepertoire(rep.idRepertoire)" [class.open]="openMenuIndex === i">

            <!-- ícone do lápis -->
            <div class="edit-icon" (click)="toggleMenu(i, $event)">
              <i class="ph ph-pencil-simple-line"></i>
            </div>

            <h3>{{ rep.nameRepertoire }}</h3>
            <p>{{ rep.totalBlocks }} blocos</p>

            <!-- menu -->
            <div class="dropdown-menu" *ngIf="openMenuIndex === i" (click)="$event.stopPropagation()">

              <button class="dropdown-item" (click)="openRepertoire(rep.idRepertoire, $event)">
                <i class="ph ph-browser"></i> Abrir
              </button>

              <button class="dropdown-item" (click)="openModal(true, rep, $event)">
                <i class="ph ph-pencil"></i> Editar
              </button>

              <button class="dropdown-item" [class.copied]="copiedId === rep.idRepertoire"
                (click)="copyLink(rep.idRepertoire, $event)">
                <i class="ph" [class.ph-check-circle]="copiedId === rep.idRepertoire"
                  [class.ph-link]="copiedId !== rep.idRepertoire"></i>
                {{ copiedId === rep.idRepertoire ? 'Link copiado!' : 'Copiar link' }}
              </button>

              <button class="dropdown-item delete" (click)="deleteRepertoire(rep, $event)">
                <i class="ph ph-trash"></i> Excluir
              </button>

            </div>

          </div>

        </div>
      </div>
    </div>


  </div> <!-- /board -->


  <!-- OVERLAY DO MENU (quando clicar fora, fecha o menu) -->
  <div class="menu-overlay" *ngIf="openMenuIndex !== null" (click)="openMenuIndex = null">
  </div>


  <!-- ======================== -->
  <!-- MODAL DE EXCLUSÃO        -->
  <!-- ======================== -->
  <div class="delete-overlay" *ngIf="deleteModalOpen" (click)="closeDeleteModal()"></div>

  <div class="delete-modal" *ngIf="deleteModalOpen">
    <h2>Excluir Repertório</h2>

    <p class="msg">
      Tem certeza que deseja excluir o repertório
      <strong>"{{ repertoireToDelete?.nameRepertoire }}"</strong>?
    </p>

    <p class="warning">Essa ação é irreversível.</p>

    <div class="delete-actions">
      <button class="cancel" (click)="closeDeleteModal()">Cancelar</button>
      <button class="delete" (click)="confirmDelete()">Excluir</button>
    </div>
  </div>


  <!-- OVERLAY DO MODAL DE CRIAR/EDITAR -->
  <div class="overlay" *ngIf="modalOpen" (click)="closeModal()"></div>

  <div class="modal" *ngIf="modalOpen" (click)="$event.stopPropagation()">
    <h2 class="modal-title">
      {{ editMode ? 'Editar Repertório' : 'Novo Repertório' }}
    </h2>

    <form [formGroup]="form" class="modal-form">
      <input #nameInput type="text" formControlName="nameRepertoire" placeholder="Nome do repertório"
        class="modal-input" />
    </form>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="closeModal()">Cancelar</button>
      <button class="btn-save" (click)="save()">Salvar</button>
    </div>

  </div>


</div>
