<app-default-login-layout
    title="Faça login em sua conta!"
    primaryBtnText="Entrar Agora"
    secondaryBtnText="Criar Conta"
    (submit)="submit()"
    (navigate)="navigate()"
    [disablePrimaryBtn]="!loginForm.valid"

>
  <form [formGroup]="loginForm" (keydown.enter)="submit()">
      <app-primary-input
          formControlName="email"
          inputName="email"
          type="email"
          label="Email"
          placeholder="maria@gmail.com"
      >
          <img src="/assets/svg/email-icon.svg"/>
      </app-primary-input>
      <app-primary-input
          formControlName="password"
          inputName="password"
          type="password"
          label="Sua Senha"
      >
          <img src="/assets/svg/password-icon.svg"/>
      </app-primary-input>
      <span (click)="navigateForgotPassword()" style="cursor: pointer;">
         Esqueceu sua senha?
      </span>

  </form>
</app-default-login-layout>
