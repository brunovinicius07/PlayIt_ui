<div class="dashboard-container" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileMenuOpen">

  <!-- TOPBAR MOBILE -->
  <div class="mobile-topbar" *ngIf="isMobile">

    <!-- ESQUERDA -->
    <button class="toggle-line-btn global-toggle" (click)="toggleSidebar()">
      <span></span>
    </button>

    <!-- DIREITA -->
    <div class="mobile-user" routerLink="/profile">
      <span class="user-name">{{ userName }}</span>
      <img src="../../../assets/img/ro.jpg" alt="Perfil" />
    </div>

  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- TOP BUTTONS -->
    <div class="top-controls">
      <button class="toggle-line-btn" (click)="toggleSidebar()">
        <span></span>
      </button>

      <button class="theme-btn" (click)="toggleDarkMode()">
        <i class="ph" [ngClass]="darkMode ? 'ph-sun' : 'ph-moon'"></i>
      </button>
    </div>

    <!-- LOGO -->
    <div class="logo-area">
      <ng-container *ngIf="!sidebarCollapsed; else iconMini">
        <img src="assets/img/logo 01.png" class="logo-full" />
      </ng-container>

      <ng-template #iconMini>
        <img src="assets/img/favicon.png" class="logo-mini" />
      </ng-template>
    </div>

    <!-- USUÁRIO DESKTOP -->
    <div class="desktop-user" *ngIf="!isMobile && !sidebarCollapsed">
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <img src="../../../assets/img/ro.jpg" alt="Perfil" />
      </div>
    </div>

    <!-- DIVISOR -->
    <div class="menu-divider"></div>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="onMenuClick()">
        <i class="ph ph-gauge"></i>
        <span *ngIf="!sidebarCollapsed">Painel</span>
      </a>

      <a routerLink="/repertoire" routerLinkActive="active" (click)="onMenuClick()">
        <i class="ph ph-music-notes"></i>
        <span *ngIf="!sidebarCollapsed">Repertórios</span>
      </a>

      <a routerLink="/schedule" routerLinkActive="active" (click)="onMenuClick()">
        <i class="ph ph-calendar"></i>
        <span *ngIf="!sidebarCollapsed">Agenda</span>
      </a>

      <a routerLink="/musicas" routerLinkActive="active" (click)="onMenuClick()">
        <i class="ph ph-music-notes-plus"></i>
        <span *ngIf="!sidebarCollapsed">Músicas</span>
      </a>

      <a routerLink="/profile" routerLinkActive="active" (click)="onMenuClick()">
        <i class="ph ph-user-circle"></i>
        <span *ngIf="!sidebarCollapsed">Perfil</span>
      </a>
    </nav>


    <!-- LOGOUT -->
    <div class="logout" (click)="logout()">
      <i class="ph ph-sign-out"></i>
      <span *ngIf="!sidebarCollapsed">Sair</span>
    </div>

  </aside>

  <!-- CONTENT AREA -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
